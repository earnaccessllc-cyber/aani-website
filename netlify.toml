[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Hero media is self-hosted from /public, so the filenames are stable rather
# than content-hashed the way Vite's bundled assets are. A week of caching
# keeps repeat visits cheap without stranding a future swap behind a long TTL
# — if one of these is replaced and needs to take effect immediately, rename
# the file (and its reference in HeroSection.jsx) to bust the cache outright.
[[headers]]
  for = "/hero.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/hero-mobile.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/hero-poster.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# API endpoints (Stripe checkout). Declared explicitly and BEFORE the SPA
# rules below so they can never be swallowed by the catch-all — the
# functions also self-declare these paths via `export const config = {path}`,
# this redirect is belt-and-suspenders so routing doesn't depend on that
# implicit behavior alone.
[[redirects]]
  from = "/api/create-checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

# Known client-side routes: served with a normal 200 so they're indexable.
# List these BEFORE the catch-all so they match first.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/collection"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/craft"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/vision"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/atelier"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/index.html"
  status = 200

# Anything else is genuinely not a page on this site: still serve the SPA
# shell (so PageNotFound.jsx renders) but report a real 404 status, instead
# of the previous catch-all that returned 200 for every unmatched URL.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
